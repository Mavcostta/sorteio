name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          mkdir -p dist/icons
          cp index.html script.js style.css manifest.json service-worker.js dist/
          cp icons/sorteio.svg dist/icons/
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
